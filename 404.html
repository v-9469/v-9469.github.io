.btn:hover{background:var(--ink);color:var(--bg)}
.rail{position:fixed;left:0;top:0;bottom:0;width:56px;border-right:1px solid var(--hair);background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 0}
.rail a{font-family:var(--mono);font-size:10px;color:var(--dim);transition:color .2s;text-decoration:none}
.rail a:hover{color:var(--ink)}
